version: "3.9"

services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: scholar
      POSTGRES_USER: scholar
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scholar -d scholar"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    command: uvicorn scholar.api.main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://scholar:${POSTGRES_PASSWORD}@db:5432/scholar
      - DATABASE_URL_SYNC=postgresql://scholar:${POSTGRES_PASSWORD}@db:5432/scholar
    working_dir: /app

  ui:
    build: .
    command: python scholar/ui/gradio_app.py
    depends_on:
      - api
    ports:
      - "7860:7860"
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://scholar:${POSTGRES_PASSWORD}@db:5432/scholar
      - DATABASE_URL_SYNC=postgresql://scholar:${POSTGRES_PASSWORD}@db:5432/scholar
    working_dir: /app

volumes:
  pgdata:
